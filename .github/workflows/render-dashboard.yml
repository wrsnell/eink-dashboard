name: Generate E-Ink Dashboard Image

on:
  schedule:
    # Runs every 30 minutes (Adjust cron schedule as needed)
    - cron: '*/30 * * * *'
  # Allows manual execution from the GitHub web UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Render Screenshot
        env:
          # Replace with your target URL (e.g. weather page, custom calendar link)
          URL_TO_CAPTURE: 'https://wttr.in/NewYork?0' 
        run: npm run render

      - name: Deploy Image to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
